[workspace]
resolver = "3"
members = ["crates/*", "app", "tests/fake-provider", "spikes/pdfium"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/jaykuroor/lecter"
publish = false

# Shared third-party versions go here (crates/CLAUDE.md); add them only through scripts/add_dep.py.
[workspace.dependencies]
serde_json = "1.0.154"
# tauri-specta needs specta pinned exactly while both are release candidates (D-048).
specta = { version = "=2.0.0-rc.25", default-features = false, features = ["std", "derive"] }
# Each crate names the features it uses (core: process, time, io-util; harness: rt).
tokio = { version = "1.54.1", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
