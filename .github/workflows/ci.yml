# docs/spec/16-ci-cd.md#ciyml-every-push-to-main-every-pull-request-manual-dispatch
# Every job runs `scripts/verify.sh --stage <name>`, exactly what sessions run locally. `e2e` runs in
# Playwright's image without the shared Setup. Job ids are status checks: never rename them
# without a D-entry (16-ci-cd.md#rules).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The spec's group, in block style: its one-line flow form is not valid YAML (`${{` inside `{ }`).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  # Docs-only pushes run lint alone (16-ci-cd.md "Docs-only pushes"). Anything unclear counts as code.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
             && git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA" 2>/dev/null \
             && files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA") && [ -n "$files" ]; then
            if ! printf '%s\n' "$files" | grep -vE '\.md$|^docs/' | grep -q . \
               && ! printf '%s\n' "$files" | grep -qx 'docs/features.json'; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the trailer, dependency and secret checks read the branch's commits
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/verify.sh --stage lint

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/verify.sh --stage test

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Playwright's image has Chromium, WebKit and their system packages, so this job installs no apt
    # packages and builds no Rust (it only runs Playwright against the mocked core). Keep the tag on
    # the Playwright version in ui/pnpm-lock.yaml; the install step below covers a mismatch.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the checkout (the container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Python 3 for verify.sh (only if the image lacks it)
        run: command -v python3 >/dev/null || { apt-get update -q && apt-get install -y -q --no-install-recommends python3; }
      - name: pnpm from ui/package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - name: Node from ui/package.json, with the pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: UI packages (lockfile only)
        run: pnpm -C ui install --frozen-lockfile --reporter=append-only
      # A no-op when the image matches the locked Playwright; downloads only the browsers if a
      # Dependabot bump moved Playwright ahead of the image tag.
      - name: Playwright browsers (already in the image)
        run: pnpm -C ui exec playwright install chromium webkit
      - run: scripts/verify.sh --stage e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: |
            ui/test-results/
            ui/playwright-report/
            .verify/
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true

  # The performance budgets (14-quality.md#performance-budgets, F-025): tests/perf/budgets.sh through
  # `verify.sh --stage perf`, which turns on the CI rule because CI is set (timing x1.5 with one
  # re-measure; memory, size and token budgets exact). It builds a release-profile app (in target/perf/, D-138) with the embedded
  # WebDriver server and measures it under xvfb-run, so it needs the shared Setup (Rust, the Tauri
  # packages, Xvfb). Under --ci the real-app keystroke_p99_ms and cold_open_ms print REPORT and the
  # mocked-core keystroke trace (Playwright Chromium) gates (D-146, D-155). The budget lines go to
  # the job summary; report.json is uploaded on every run.
  perf:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Playwright Chromium (the mocked-core keystroke check)
        run: pnpm -C ui exec playwright install --with-deps chromium
      - name: Performance budgets (real app under xvfb-run)
        run: xvfb-run -a -s "-screen 0 1280x800x24" scripts/verify.sh --stage perf
      - name: Upload the budget report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-report
          path: |
            tests/perf/report.json
            tests/perf/logs/
            .verify/perf.log
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true

  # The same budgets on macOS and Windows, on manual runs only (and nightly from F-174): the
  # per-OS memory and cold-open targets come from these runs' release-build measurements (D-146,
  # D-152), and an OS without a target yet prints REPORT. Not a required check: `perf` above is.
  perf-os:
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # main never runs this job, so borrow the test job's Rust cache, which main saves (D-154).
      - uses: ./.github/actions/setup
        with:
          rust-shared-key: test
      - name: Playwright Chromium (the mocked-core keystroke check)
        run: pnpm -C ui exec playwright install --with-deps chromium
      - name: Performance budgets (real app)
        run: scripts/verify.sh --stage perf
      - name: Upload the budget report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-report-${{ matrix.os }}
          path: |
            tests/perf/report.json
            tests/perf/logs/
            .verify/perf.log
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true

  # D-154: the real-app flows run in parallel shards, each on its own runner with its own build and
  # app. tests/e2e/support/shards.ts picks each shard's flows from their measured seconds; Linux
  # shard 1 is cold-open alone (it times cold starts on a quiet machine, D-152). The `e2e-app (<os>)`
  # job after them keeps the status-check name (16-ci-cd.md rule 4).
  e2e-app-shard:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows only on manual runs (and nightly); every push and PR runs Linux.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-24.04","macos-15","windows-2025"]') || fromJSON('["ubuntu-24.04"]') }}
        # 1..E2E_APP_SHARDS (the e2e-app job checks the same count; crates/harness/tests/ci.rs).
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      E2E_APP_SHARDS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux: e2e-app's own cache, which main saves (cold-open's release build gets one of its
      # own). macOS and Windows: main never runs e2e-app there, so borrow the test job's.
      - uses: ./.github/actions/setup
        with:
          rust-shared-key: ${{ matrix.os != 'ubuntu-24.04' && 'test' || matrix.shard == 1 && 'e2e-app-cold-open' || 'e2e-app' }}
      # Debug build with the embedded WebDriver server, then this shard's WebdriverIO flows.
      - name: Real-app flows (under xvfb-run on Linux)
        env:
          LECTER_E2E_SHARD: ${{ matrix.shard }}/${{ env.E2E_APP_SHARDS }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1280x800x24" scripts/verify.sh --stage e2e-app
          else scripts/verify.sh --stage e2e-app; fi
      # Every run, passing too: a passing stage prints only PASS, and the logs and timings.json
      # (seconds per flow) are where its detail is (D-154).
      - name: Upload screenshots, logs and flow times
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-app-${{ matrix.os }}-${{ matrix.shard }}
          path: .verify/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  # The `e2e-app (<os>)` status check: passes only when every shard of its OS passed
  # (scripts/e2e_app_gate.py reads this run's jobs). Skipped, like the shards, on docs-only pushes.
  e2e-app:
    needs: [changes, e2e-app-shard]
    # Also after a failed shard (that's what it reports), but not in a cancelled run.
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-24.04","macos-15","windows-2025"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      E2E_APP_SHARDS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/e2e_app_gate.py
          sparse-checkout-cone-mode: false
      - name: Every e2e-app shard on ${{ matrix.os }} passed
        env:
          GH_TOKEN: ${{ github.token }}
          OS: ${{ matrix.os }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | {name, conclusion}' | python3 scripts/e2e_app_gate.py "$OS" "$E2E_APP_SHARDS"

  release-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Release-profile build, then scripts/check_release_binary.sh on it (must pass) and on the
      # debug builds (must fail), so the check is proven to see the WebDriver server and test hooks.
      - run: tests/e2e/release-check.sh
