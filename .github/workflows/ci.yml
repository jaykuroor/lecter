# docs/spec/16-ci-cd.md#ciyml-every-push-to-main-every-pull-request-manual-dispatch
# Every job runs `scripts/verify.sh --stage <name>`, exactly what sessions run locally. Job ids are status
# checks: never rename them without a D-entry (16-ci-cd.md#rules). e2e-app, perf and release-check arrive
# with the walking skeleton.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The spec's group, in block style: its one-line flow form is not valid YAML (`${{` inside `{ }`).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  # Docs-only pushes run lint alone (16-ci-cd.md "Docs-only pushes"). Anything unclear counts as code.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
             && git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA" 2>/dev/null \
             && files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA") && [ -n "$files" ]; then
            if ! printf '%s\n' "$files" | grep -vE '\.md$|^docs/' | grep -q . \
               && ! printf '%s\n' "$files" | grep -qx 'docs/features.json'; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the trailer, dependency and secret checks read the branch's commits
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/verify.sh --stage lint

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/verify.sh --stage test

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Playwright's image has Chromium, WebKit and their system packages, so this job installs no apt
    # packages and builds no Rust (it only runs Playwright against the mocked core). Keep the tag on
    # the Playwright version in ui/pnpm-lock.yaml; the install step below covers a mismatch.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the checkout (the container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Python 3 for verify.sh (only if the image lacks it)
        run: command -v python3 >/dev/null || { apt-get update -q && apt-get install -y -q --no-install-recommends python3; }
      - name: pnpm from ui/package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - name: Node from ui/package.json, with the pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: UI packages (lockfile only)
        run: pnpm -C ui install --frozen-lockfile --reporter=append-only
      # A no-op when the image matches the locked Playwright; downloads only the browsers if a
      # Dependabot bump moved Playwright ahead of the image tag.
      - name: Playwright browsers (already in the image)
        run: pnpm -C ui exec playwright install chromium webkit
      - run: scripts/verify.sh --stage e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: |
            ui/test-results/
            ui/playwright-report/
            .verify/
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true

  e2e-app:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows only on manual runs (and nightly); every push and PR runs Linux.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-24.04","macos-15","windows-2025"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Debug build with the embedded WebDriver server, then the WebdriverIO flows in tests/e2e/.
      - name: Real-app flows (under xvfb-run on Linux)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1280x800x24" scripts/verify.sh --stage e2e-app
          else scripts/verify.sh --stage e2e-app; fi
      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-app-${{ matrix.os }}
          path: .verify/
          retention-days: 14
          if-no-files-found: ignore

  release-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Release-profile build, then scripts/check_release_binary.sh on it (must pass) and on the
      # debug builds (must fail), so the check is proven to see the WebDriver server and test hooks.
      - run: tests/e2e/release-check.sh
