# docs/spec/16-ci-cd.md#ciyml-every-push-to-main-every-pull-request-manual-dispatch
# Every job runs `scripts/verify.sh --stage <name>`, exactly what sessions run locally. Job ids are status
# checks: never rename them without a D-entry (16-ci-cd.md#rules). e2e-app, perf and release-check arrive
# with the walking skeleton.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The spec's group, in block style: its one-line flow form is not valid YAML (`${{` inside `{ }`).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the trailer, dependency and secret checks read the branch's commits
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/verify.sh --stage lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/verify.sh --stage test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Playwright browsers (chromium, webkit)
        run: pnpm -C ui exec playwright install --with-deps chromium webkit
      - run: scripts/verify.sh --stage e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: |
            ui/test-results/
            ui/playwright-report/
            .verify/
          retention-days: 14
          if-no-files-found: ignore
