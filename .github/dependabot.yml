# docs/spec/16-ci-cd.md#dependabotyml: weekly, one grouped PR per ecosystem, at most 3 open each.
# The author merges them on GitHub once CI is green; sessions never merge PRs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # The two-week rule for new versions (01-architecture.md#dependency-policy).
    cooldown:
      default-days: 14
    ignore:
      # Node 24 is the runtime (ui/package.json engines); its types stay on 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # WebdriverIO 10 waits until @wdio/tauri-service supports it (D-109 pairs the plugin and service with WebdriverIO 9).
      - dependency-name: "@wdio/*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
