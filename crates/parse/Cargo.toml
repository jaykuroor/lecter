[package]
name = "lecter-parse"
description = "Parse worker: reads one untrusted slide file into blocks, layout and crops."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The worker process the core spawns (18-contracts.md#worker-protocol).
[[bin]]
name = "lecter-parse"
path = "src/main.rs"
required-features = ["worker"]

[lints]
workspace = true

[features]
default = ["worker"]
# The worker message types and their frame codec: all the core may use (01-architecture.md#repository-layout).
proto = ["dep:serde", "dep:postcard", "dep:serde_json", "dep:thiserror"]
# The readers themselves: PDFium, layout and the worker loop.
worker = ["proto", "dep:pdfium-render"]

[dependencies]
pdfium-render = { version = "0.9.4", default-features = false, features = ["thread_safe", "pdfium_7881"], optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { version = "2.0.21", optional = true }
