[package]
name = "lecter-harness"
description = "The core as JSON over the command line, for tests and agents. Never shipped."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A test driver only: no app manifest depends on this crate and no bundle lists it
# (crates/harness/tests/never_shipped.rs).
[[bin]]
name = "lecter-harness"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
lecter-core = { path = "../core" }
# The parse worker itself: `lecter-harness parse` runs it as its own child process.
lecter-parse = { path = "../parse" }
serde_json.workspace = true
# A current-thread runtime for the core's async worker calls.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
# TestEnv (a throwaway LECTER_TEST_HOME) for the tests that run the binary. test-hooks keeps it in
# release-profile test runs; dev-dependency features never reach another crate's normal build.
lecter-core = { path = "../core", features = ["test-hooks"] }
