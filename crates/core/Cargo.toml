[package]
name = "lecter-core"
description = "Course and lecture files, document model, journal, jobs, settings and keychain."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
directories = "6.0.0"
# The parse worker's message types and frame codec only (01-architecture.md#repository-layout).
lecter-parse = { path = "../parse", default-features = false, features = ["proto"] }
serde = { version = "1", default-features = false, features = ["derive"] }
# The TypeScript shape of the IPC types for the app's generated bindings; nothing else needs it.
specta = { workspace = true, optional = true }
thiserror = "2.0.21"
# Worker processes: spawn, pipe I/O and the per-file time limit, on the app's runtime.
tokio = { workspace = true, features = ["process", "time", "io-util"] }

[features]
# The debug-only test hooks (01-architecture.md#debug-only-test-hooks) in a release-profile build.
# Debug builds have them anyway; the app's release build never enables this
# (scripts/check_release_binary.sh).
test-hooks = []
# Derives specta::Type on the types the app exports to ui/src/core/bindings.ts (18-contracts.md#ipc).
specta = ["dep:specta"]

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "process", "time", "io-util"] }
