# cargo-deny policy. The licence list is 01-architecture.md#dependency-policy, exactly; change it there first.
# Run: cargo deny check licenses bans sources   (advisories run in verify --full)

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Reviewed by the maintainer 2026-11-04 (D-169): "unmaintained" notices, not vulnerabilities, for
# build-time-only proc-macro helpers pulled in transitively, with no maintained upgrade path.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc-macro, build-time only, via specta (IPC bindings); revisit when specta drops it" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained proc-macro, build-time only, via glib-macros in Tauri's gtk3 stack (Linux); revisit when Tauri leaves gtk-rs 0.18" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# The list is policy, not inventory: a licence nothing uses yet is still allowed.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
]

[licenses.private]
# Lecter's own crates are MIT and never published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path, never by wildcard version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
