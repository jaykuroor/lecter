# cargo-deny policy. The licence list is 01-architecture.md#dependency-policy, exactly; change it there first.
# Run: cargo deny check licenses bans sources   (advisories run in verify --full)

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
# The list is policy, not inventory: a licence nothing uses yet is still allowed.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
]

[licenses.private]
# Lecter's own crates are MIT and never published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path, never by wildcard version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
