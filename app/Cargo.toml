[package]
name = "lecter-app"
description = "Tauri 2 shell: commands, channels, the lecter:// protocol, windows and capabilities."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
tauri = "2"

[dev-dependencies]
serde_json.workspace = true
lecter-core = { path = "../crates/core" }

[features]
# Embeds ui/dist and serves it over Tauri's custom protocol. Release builds need it (main.rs
# refuses to compile without it); debug builds leave it off and load build.devUrl.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2"
